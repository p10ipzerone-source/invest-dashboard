name: 데이터 갱신

on:
  schedule:
    # 22:30 UTC 월~금 = 한국시간 화~토 07:30 (미국장 마감 후)
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 데이터 받기
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KOFR_STAT_CODE: ${{ secrets.KOFR_STAT_CODE }}
          KOFR_ITEM_CODE: ${{ secrets.KOFR_ITEM_CODE }}
        run: python fetch_data.py
      - name: 커밋
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add docs/data.js
          git diff --cached --quiet || git commit -m "데이터 갱신 $(date -u +%Y-%m-%d)"
          git push
